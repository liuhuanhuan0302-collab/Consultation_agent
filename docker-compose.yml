services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env.production
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - backend_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_net

  report_worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "scripts/report_worker.py"]
    env_file:
      - .env.production
    volumes:
      - backend_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - app_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_APP_BASE_PATH: /diagnosis/
        VITE_DIAGNOSIS_URL: /diagnosis/?source=OFFICIAL_WEBSITE
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - app_net

volumes:
  mysql_data:
  backend_data:
  caddy_data:
  caddy_config:

networks:
  app_net:
