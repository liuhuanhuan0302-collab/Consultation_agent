<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    The shared DOCX renderer declares Microsoft YaHei to preserve the existing
    internal Word layout. The Linux image cannot redistribute that proprietary
    font, so LibreOffice must deterministically substitute the installed CJK
    family instead of relying on host-dependent font discovery order.
  -->
  <alias binding="strong">
    <family>Microsoft YaHei</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
</fontconfig>
