<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>页面未找到 - 优鲲智能</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #111827;
        background: #f7faff;
        font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      }
      main { width: min(100%, 560px); text-align: center; }
      .brand { margin-bottom: 40px; color: #5848c8; font-size: 22px; font-weight: 700; }
      strong { display: block; margin-bottom: 12px; color: #1677ff; font-size: 72px; line-height: 1; }
      h1 { margin: 0 0 16px; font-size: 32px; }
      p { margin: 0 0 32px; color: #667085; line-height: 1.7; }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0 26px;
        color: #fff;
        background: #1677ff;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover { background: #0f63d8; }
      a:active { transform: scale(0.98); }
      a:focus-visible { outline: 3px solid rgba(22, 119, 255, 0.34); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">优鲲智能</div>
      <strong>404</strong>
      <h1>页面未找到</h1>
      <p>你访问的页面不存在或已被移动，请返回官网继续浏览。</p>
      <a href="/">返回首页</a>
    </main>
  </body>
</html>
