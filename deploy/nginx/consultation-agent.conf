# 生产 Nginx 模板：强制 HTTPS。
#
# 部署步骤（首次上线时）：
#   1. 将下方两处 server_name 替换为真实域名（如 diagnosis.example.com）
#   2. 申请证书：certbot --nginx -d diagnosis.example.com（自动改写本文件并配置续期）
#      或手动放置证书后把 ssl_certificate / ssl_certificate_key 指向真实路径
#   3. nginx -t && systemctl reload nginx
#
# 说明：客户资料、报告 token 与管理员登录 Cookie 一律走 TLS；80 端口只做
# 301 跳转。后端在 production 环境会拒绝 http:// 的 PUBLIC_WEB_BASE_URL 与
# CORS_ORIGINS（fail-closed），因此必须完成证书配置后应用才能启动。

# ── HTTP → HTTPS 强制跳转 ────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name 8.138.165.2;   # 部署时替换为真实域名

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS 主站 ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 8.138.165.2;   # 部署时替换为真实域名

    # TLS 证书路径（部署时替换为真实路径，certbot 会自动生成）
    ssl_certificate     /etc/letsencrypt/live/8.138.165.2/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.138.165.2/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
